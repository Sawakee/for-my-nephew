<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おとあてクイズ 👂</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
  display: flex; flex-direction: column; align-items: center;
  color: white;
  background: linear-gradient(-45deg, #5f72bd, #9b23ea, #6a3093, #a044ff);
  background-size: 400% 400%;
  animation: bgAnim 16s ease infinite;
}
@keyframes bgAnim {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}
.note-float {
  position: fixed; pointer-events: none; z-index: 0;
  animation: floatUp linear infinite;
  opacity: 0;
}
@keyframes floatUp {
  0%   { transform: translateY(105vh) rotate(-10deg); opacity: 0; }
  10%  { opacity: 0.35; }
  90%  { opacity: 0.35; }
  100% { transform: translateY(-10vh) rotate(10deg); opacity: 0; }
}
header { text-align: center; padding: 0.9rem 1rem 0.3rem; z-index: 2; }
h1 {
  font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 900;
  text-shadow: 0 0 18px rgba(200,150,255,0.7), 0 3px 6px rgba(0,0,0,0.35);
}
#hud { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.5rem; }
.pill {
  background: rgba(255,255,255,0.16);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 30px; padding: 0.32rem 1.1rem;
  font-weight: 900; font-size: 1rem; min-width: 96px;
}
#quiz {
  flex: 1; width: min(94vw, 480px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1.2rem; padding-bottom: 2rem;
  z-index: 1;
}
#question {
  font-size: clamp(1.15rem, 4.5vw, 1.5rem); font-weight: 900;
  text-align: center; line-height: 1.6;
  text-shadow: 0 2px 6px rgba(0,0,0,0.35);
  min-height: 3.2rem;
}
#listen-btn {
  background: rgba(255,255,255,0.92);
  color: #5f3dc4; border: none;
  font-size: 1.5rem; font-weight: 900;
  padding: 1rem 2.6rem; border-radius: 60px;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  transition: transform 0.15s;
}
#listen-btn:active { transform: scale(0.93); }
#listen-btn.playing { animation: pulse 0.5s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
#choices {
  display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center;
  width: 100%;
}
.choice {
  flex: 1; min-width: 110px; max-width: 200px;
  background: rgba(255,255,255,0.16);
  border: 2px solid rgba(255,255,255,0.45);
  backdrop-filter: blur(10px);
  color: white; border-radius: 22px;
  font-size: 1.25rem; font-weight: 900;
  padding: 1.1rem 0.6rem;
  cursor: pointer;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  transition: transform 0.12s, background 0.2s;
}
.choice:active { transform: scale(0.93); }
.choice.correct { background: rgba(105,219,124,0.75); border-color: #69db7c; animation: bounceIn 0.4s; }
.choice.incorrect { background: rgba(255,107,107,0.7); border-color: #ff6b6b; animation: shake 0.35s; }
.choice:disabled { cursor: default; }
@keyframes bounceIn { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
#feedback {
  min-height: 2.4rem; font-size: 1.5rem; font-weight: 900;
  text-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
#overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 1.5rem;
  background: rgba(40,10,70,0.6);
  backdrop-filter: blur(6px);
}
#overlay.hidden { display: none; }
.panel {
  background: rgba(255,255,255,0.12);
  border: 2px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(14px);
  border-radius: 28px; padding: 2rem 2.2rem;
  max-width: 380px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.panel h2 { font-size: clamp(1.6rem, 6vw, 2.3rem); margin-bottom: 0.6rem; }
.panel p { font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.2rem; }
.panel .big-score { font-size: 3rem; font-weight: 900; margin: 0.2rem 0; }
.panel .best { font-size: 1rem; opacity: 0.9; margin-bottom: 1.2rem; }
.play-btn {
  background: linear-gradient(145deg, #ffd93d, #ff9f1c);
  color: #4a3500; border: none;
  font-size: 1.4rem; font-weight: 900;
  padding: 0.8rem 2.4rem; border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(255,159,28,0.5);
  transition: transform 0.15s;
}
.play-btn:hover { transform: scale(1.06); }
.play-btn:active { transform: scale(0.95); }
#back-btn, #audio-btn {
  position: fixed; top: 0.8rem; z-index: 30;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(8px);
  color: white; border: 1px solid rgba(255,255,255,0.45);
  border-radius: 10px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 700;
}
#back-btn { left: 0.8rem; }
#audio-btn { right: 0.8rem; font-size: 1.1rem; line-height: 1.4; }
#confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 25; display: none; }
</style>
</head>
<body>
<a href="../" id="back-btn">← もどる</a>
<button id="audio-btn" aria-label="おと">🔊</button>

<header>
  <h1>👂 おとあてクイズ</h1>
  <div id="hud">
    <div class="pill">もんだい <span id="qnum">1</span>/10</div>
    <div class="pill">せいかい <span id="score">0</span></div>
  </div>
</header>

<div id="quiz">
  <div id="question"></div>
  <button id="listen-btn">🔊 おとを きく</button>
  <div id="choices"></div>
  <div id="feedback"></div>
</div>

<div id="overlay">
  <div class="panel" id="panel">
    <h2>👂 おとあてクイズ</h2>
    <p>おとを よーく きいて こたえてね！<br>「🔊 おとを きく」を おすと<br>なんかいでも きけるよ</p>
    <button class="play-btn" id="start-btn">あそぶ！</button>
  </div>
</div>

<canvas id="confetti-layer"></canvas>

<script>
// --- Web Audio SFX ---
const Sfx = (() => {
  let ctx;
  let muted = localStorage.getItem('sfx-muted') === '1';
  const init = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  const play = (freq, dur, type='sine', vol=0.2, delay=0) => {
    if (muted) return;
    init();
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  };
  const seq = (notes, type='triangle', vol=0.22) => {
    let t = 0;
    notes.forEach(([f, d]) => { play(f, d, type, vol, t); t += d * 0.9; });
  };
  return {
    play, seq,
    good:  () => seq([[784,0.08],[1175,0.16]], 'triangle', 0.24),
    bad:   () => play(170, 0.25, 'sawtooth', 0.14),
    start: () => seq([[523,0.1],[659,0.1],[784,0.18]], 'triangle', 0.22),
    end:   () => seq([[784,0.14],[587,0.14],[440,0.28]], 'sawtooth', 0.2),
    record:() => seq([[660,0.09],[880,0.09],[1175,0.09],[1568,0.26]], 'triangle', 0.26),
    toggle() { muted = !muted; localStorage.setItem('sfx-muted', muted ? '1' : '0'); return muted; },
    muted: () => muted
  };
})();
(() => {
  const btn = document.getElementById('audio-btn');
  btn.textContent = Sfx.muted() ? '🔇' : '🔊';
  btn.addEventListener('click', () => { btn.textContent = Sfx.toggle() ? '🔇' : '🔊'; });
})();

// floating notes background
for (let i = 0; i < 10; i++) {
  const n = document.createElement('span');
  n.className = 'note-float';
  n.textContent = ['🎵','🎶','♪','♫'][Math.floor(Math.random()*4)];
  n.style.left = Math.random()*100 + 'vw';
  n.style.fontSize = (1 + Math.random()*1.6) + 'rem';
  const d = 9 + Math.random()*10;
  n.style.animationDuration = d + 's';
  n.style.animationDelay = -(Math.random()*d) + 's';
  document.body.appendChild(n);
}

// --- Question generators ---
const HIGH = [880, 1047, 1319];
const LOW = [131, 165, 196];
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const QUESTION_TYPES = [
  // たかい？ひくい？
  () => {
    const isHigh = Math.random() < 0.5;
    const f = isHigh ? rnd(HIGH) : rnd(LOW);
    return {
      text: 'この おとは たかい？ ひくい？',
      sound: () => Sfx.play(f, 0.7, 'triangle', 0.25),
      dur: 800,
      choices: ['⬆️ たかい', '⬇️ ひくい'],
      answer: isHigh ? 0 : 1,
    };
  },
  // どっちがたかい？
  () => {
    const firstHigh = Math.random() < 0.5;
    const a = firstHigh ? rnd(HIGH) : rnd(LOW);
    const b = firstHigh ? rnd(LOW) : rnd(HIGH);
    return {
      text: 'たかい おとは どっち？',
      sound: () => { Sfx.play(a, 0.45, 'triangle', 0.25, 0); Sfx.play(b, 0.45, 'triangle', 0.25, 0.75); },
      dur: 1400,
      choices: ['1️⃣ さいしょ', '2️⃣ あと'],
      answer: firstHigh ? 0 : 1,
    };
  },
  // なんかい なった？
  () => {
    const n = 2 + Math.floor(Math.random() * 3); // 2..4
    return {
      text: 'おとは なんかい なった？',
      sound: () => { for (let i = 0; i < n; i++) Sfx.play(740, 0.14, 'triangle', 0.25, i * 0.42); },
      dur: 4 * 420,
      choices: shuffle([2, 3, 4]).map(x => x + ' かい'),
      answerValue: n + ' かい',
    };
  },
  // ながいのはどっち？
  () => {
    const firstLong = Math.random() < 0.5;
    const d1 = firstLong ? 1.0 : 0.18;
    const d2 = firstLong ? 0.18 : 1.0;
    return {
      text: 'ながーい おとは どっち？',
      sound: () => { Sfx.play(523, d1, 'triangle', 0.25, 0); Sfx.play(523, d2, 'triangle', 0.25, d1 + 0.45); },
      dur: (d1 + d2 + 0.5) * 1000,
      choices: ['1️⃣ さいしょ', '2️⃣ あと'],
      answer: firstLong ? 0 : 1,
    };
  },
];

// --- Game ---
const TOTAL = 10;
const qEl = document.getElementById('question');
const qnumEl = document.getElementById('qnum');
const scoreEl = document.getElementById('score');
const choicesEl = document.getElementById('choices');
const feedbackEl = document.getElementById('feedback');
const listenBtn = document.getElementById('listen-btn');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

let qIndex = 0, score = 0, q = null, answered = false;

function playSound() {
  if (!q) return;
  q.sound();
  listenBtn.classList.add('playing');
  setTimeout(() => listenBtn.classList.remove('playing'), q.dur);
}
listenBtn.addEventListener('click', playSound);

function nextQuestion() {
  if (qIndex >= TOTAL) return endGame();
  q = rnd(QUESTION_TYPES)();
  answered = false;
  qnumEl.textContent = qIndex + 1;
  qEl.textContent = q.text;
  feedbackEl.textContent = '';
  choicesEl.innerHTML = '';
  q.choices.forEach((label, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = label;
    b.addEventListener('click', () => pick(b, i, label));
    choicesEl.appendChild(b);
  });
  setTimeout(playSound, 450);
}

function pick(btn, i, label) {
  if (answered) return;
  answered = true;
  const correct = q.answerValue !== undefined ? label === q.answerValue : i === q.answer;
  [...choicesEl.children].forEach(b => b.disabled = true);
  if (correct) {
    score++;
    scoreEl.textContent = score;
    btn.classList.add('correct');
    feedbackEl.textContent = 'せいかい！⭕';
    Sfx.good();
  } else {
    btn.classList.add('incorrect');
    const right = [...choicesEl.children].find(b =>
      q.answerValue !== undefined ? b.textContent === q.answerValue : b === choicesEl.children[q.answer]);
    if (right) right.classList.add('correct');
    feedbackEl.textContent = 'ざんねん…❌';
    Sfx.bad();
  }
  qIndex++;
  setTimeout(nextQuestion, 1400);
}

function startGame() {
  qIndex = 0; score = 0;
  scoreEl.textContent = '0';
  overlay.classList.add('hidden');
  Sfx.start();
  nextQuestion();
}

function endGame() {
  const best = +(localStorage.getItem('oto-quiz-best') || 0);
  const isRecord = score > best;
  if (isRecord) localStorage.setItem('oto-quiz-best', score);

  let msg;
  if (score === TOTAL) msg = 'パーフェクト！おみみ はかせ！💮';
  else if (score >= 7) msg = 'すごい おみみ！🎉';
  else if (score >= 4) msg = 'よくできました！';
  else msg = 'またチャレンジしてね！';

  panel.innerHTML = `
    <h2>${isRecord && score > 0 ? '🏆 しんきろく！' : '👂 おしまい！'}</h2>
    <div class="big-score">${score}/${TOTAL}</div>
    <div class="best">ベスト: ${Math.max(score, best)}/${TOTAL}</div>
    <p>${msg}</p>
    <button class="play-btn" id="again-btn">もういちど！</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('again-btn').addEventListener('click', startGame);

  if (score === TOTAL || (isRecord && score > 0)) { Sfx.record(); launchConfetti(); }
  else Sfx.end();
}

document.getElementById('start-btn').addEventListener('click', startGame);

function launchConfetti() {
  const cv = document.getElementById('confetti-layer');
  cv.style.display = 'block';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const ps = Array.from({length: 90}, () => ({
    x: Math.random()*cv.width, y: -20,
    vx: (Math.random()-0.5)*7, vy: 1+Math.random()*5,
    r: 6+Math.random()*10, rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.2,
    color: `hsl(${Math.random()*360},90%,60%)`,
    type: Math.floor(Math.random()*3)
  }));
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    ps.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.rot+=p.vrot;
      if (p.y < cv.height+30) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if (p.type===0) ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.6);
      else if (p.type===1) { ctx.beginPath(); ctx.arc(0,0,p.r/2,0,Math.PI*2); ctx.fill(); }
      else {
        ctx.beginPath();
        for (let j=0;j<5;j++) {
          const a=(j*4*Math.PI/5)-Math.PI/2, b=(j*4*Math.PI/5+2*Math.PI/5)-Math.PI/2;
          j===0 ? ctx.moveTo(Math.cos(a)*p.r,Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
          ctx.lineTo(Math.cos(b)*p.r*0.4,Math.sin(b)*p.r*0.4);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else cv.style.display = 'none';
  }
  draw();
}
</script>
</body>
</html>
