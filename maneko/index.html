<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まねっこ 🎵</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  user-select: none; padding: 1rem;
  background: linear-gradient(-45deg, #2c3e50, #3498db, #9b59b6, #e74c3c, #2c3e50);
  background-size: 400% 400%;
  animation: bgAnim 12s ease infinite;
  position: relative; overflow: hidden;
}
@keyframes bgAnim {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}
.bg-note {
  position: fixed; pointer-events: none;
  opacity: 0.1; font-size: 2rem;
  animation: drift linear infinite;
}
@keyframes drift {
  0%   { transform: translate(0, 110vh) rotate(0); opacity: 0; }
  10%  { opacity: 0.15; }
  90%  { opacity: 0.15; }
  100% { transform: translate(30px, -10vh) rotate(360deg); opacity: 0; }
}
h1 {
  position: relative; z-index: 1;
  font-size: clamp(1.8rem, 6vw, 3rem);
  font-weight: 900; margin-bottom: 0.4rem;
  color: white;
  text-shadow: 0 0 25px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.3);
  animation: titleBeat 1.6s ease-in-out infinite;
}
@keyframes titleBeat {
  0%,100% { transform: scale(1); }
  50%     { transform: scale(1.05); }
}
#stats {
  position: relative; z-index: 1;
  display: flex; gap: 0.8rem; margin-bottom: 1rem;
  flex-wrap: wrap; justify-content: center;
}
.stat-pill {
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 30px; padding: 0.4rem 1.1rem;
  color: white; font-size: 1rem; font-weight: 700;
  text-shadow: 0 2px 4px rgba(0,0,0,0.25);
}
#status {
  position: relative; z-index: 1;
  color: white; font-size: clamp(1.1rem, 4vw, 1.6rem);
  font-weight: 900; text-align: center;
  margin-bottom: 1.2rem; min-height: 2em;
  text-shadow: 0 0 18px rgba(255,255,255,0.55), 0 3px 6px rgba(0,0,0,0.3);
  letter-spacing: 0.02em;
}
#board {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  padding: 1rem;
  background: rgba(0,0,0,0.25);
  border-radius: 28px;
  border: 3px solid rgba(255,255,255,0.25);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.pad {
  width: clamp(110px, 28vw, 165px);
  height: clamp(110px, 28vw, 165px);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(3.5rem, 11vw, 5.5rem);
  border: 4px solid rgba(255,255,255,0.3);
  cursor: pointer;
  transition: filter 0.12s, transform 0.12s, box-shadow 0.12s;
  position: relative; overflow: hidden;
  filter: brightness(0.7) saturate(0.8);
  font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
}
.pad::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%);
  pointer-events: none; border-radius: inherit;
}
.pad.p0 { background: linear-gradient(145deg, #ff6b6b, #ee5253); box-shadow: 0 0 0 0 rgba(255,107,107,0); }
.pad.p1 { background: linear-gradient(145deg, #feca57, #ff9f43); box-shadow: 0 0 0 0 rgba(254,202,87,0); }
.pad.p2 { background: linear-gradient(145deg, #1dd1a1, #10ac84); box-shadow: 0 0 0 0 rgba(29,209,161,0); }
.pad.p3 { background: linear-gradient(145deg, #54a0ff, #2e86de); box-shadow: 0 0 0 0 rgba(84,160,255,0); }
.pad.lit {
  filter: brightness(1.5) saturate(1.5);
  transform: scale(1.06);
}
.pad.p0.lit { box-shadow: 0 0 40px 10px rgba(255,107,107,0.7); }
.pad.p1.lit { box-shadow: 0 0 40px 10px rgba(254,202,87,0.7); }
.pad.p2.lit { box-shadow: 0 0 40px 10px rgba(29,209,161,0.7); }
.pad.p3.lit { box-shadow: 0 0 40px 10px rgba(84,160,255,0.7); }
.pad.disabled { pointer-events: none; cursor: default; }
#start-btn {
  position: relative; z-index: 1;
  margin-top: 1.3rem; padding: 0.8rem 2.4rem;
  font-size: 1.15rem; border: none; border-radius: 30px;
  background: linear-gradient(135deg, #ffd93d, #ff6b6b);
  color: white; font-weight: 900; cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,107,107,0.45);
  transition: transform 0.18s;
  text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}
#start-btn:hover { transform: scale(1.07); }
#start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#back-btn, #audio-btn {
  position: fixed; top: 1rem; z-index: 10;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  color: white; border: 1px solid rgba(255,255,255,0.35);
  border-radius: 10px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.9rem; text-decoration: none;
  transition: background 0.2s;
}
#back-btn { left: 1rem; }
#audio-btn { right: 1rem; font-size: 1.1rem; line-height: 1; }
#back-btn:hover, #audio-btn:hover { background: rgba(255,255,255,0.3); }
#confetti-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 100; display: none;
}
body.watching #board { box-shadow: 0 10px 40px rgba(255,215,0,0.35), inset 0 0 0 2px rgba(255,215,0,0.4); }
body.your-turn #board { box-shadow: 0 10px 40px rgba(29,209,161,0.4), inset 0 0 0 2px rgba(29,209,161,0.5); }
body.game-over #board { box-shadow: 0 10px 40px rgba(231,76,60,0.45), inset 0 0 0 2px rgba(231,76,60,0.55); }
</style>
</head>
<body>
<a href="../" id="back-btn">← もどる</a>
<button id="audio-btn" aria-label="おと">🔊</button>

<h1>🎵 まねっこ</h1>
<div id="stats">
  <div class="stat-pill">ステージ: <span id="stage">0</span></div>
  <div class="stat-pill">ベスト: <span id="best">0</span></div>
</div>
<div id="status">▶ スタートをおしてね</div>
<div id="board">
  <div class="pad p0" data-idx="0">🐶</div>
  <div class="pad p1" data-idx="1">🐤</div>
  <div class="pad p2" data-idx="2">🐸</div>
  <div class="pad p3" data-idx="3">🐠</div>
</div>
<button id="start-btn">▶ スタート</button>
<canvas id="confetti-layer"></canvas>

<script>
// --- Web Audio SFX ---
const Sfx = (() => {
  let ctx;
  let muted = localStorage.getItem('sfx-muted') === '1';
  const init = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  const play = (freq, dur, type='sine', vol=0.25, delay=0) => {
    if (muted) return;
    init();
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  };
  const seq = (notes, type='triangle', vol=0.22) => {
    let t = 0;
    notes.forEach(([f, d]) => { play(f, d, type, vol, t); t += d * 0.9; });
  };
  // Pentatonic C major — friendly, no dissonance
  const PAD_NOTES = [523.25, 659.25, 783.99, 987.77]; // C5, E5, G5, B5
  return {
    pad: i => play(PAD_NOTES[i], 0.35, 'triangle', 0.22),
    fail: () => seq([[330, 0.15],[247, 0.2],[196, 0.3]], 'sawtooth', 0.18),
    win:  () => seq([[659, 0.12],[784, 0.12],[1047, 0.28]], 'triangle', 0.25),
    clear: () => seq([[523,0.14],[659,0.14],[784,0.14],[1047,0.18],[1319,0.3]], 'triangle', 0.28),
    toggle() { muted = !muted; localStorage.setItem('sfx-muted', muted ? '1' : '0'); return muted; },
    muted: () => muted
  };
})();
(() => {
  const btn = document.getElementById('audio-btn');
  btn.textContent = Sfx.muted() ? '🔇' : '🔊';
  btn.addEventListener('click', () => {
    const m = Sfx.toggle();
    btn.textContent = m ? '🔇' : '🔊';
  });
})();

// Background floating notes
const BG_NOTES = ['🎵','🎶','♪','♫','✨','🌟'];
for (let i = 0; i < 14; i++) {
  const el = document.createElement('span');
  el.className = 'bg-note';
  el.textContent = BG_NOTES[Math.floor(Math.random()*BG_NOTES.length)];
  el.style.left = Math.random()*100 + 'vw';
  el.style.animationDuration = (10 + Math.random()*8) + 's';
  el.style.animationDelay = (Math.random()*8) + 's';
  document.body.appendChild(el);
}

// --- Game state ---
const PADS = 4;
let sequence = [];
let playerIdx = 0;
let accepting = false;
let stage = 0;
let best = +(localStorage.getItem('maneko-best') || 0);
document.getElementById('best').textContent = best;

const statusEl = document.getElementById('status');
const stageEl  = document.getElementById('stage');
const startBtn = document.getElementById('start-btn');
const pads     = document.querySelectorAll('.pad');

function setStatus(text, body) {
  statusEl.textContent = text;
  document.body.className = body || '';
}

function lightPad(i, dur=420) {
  const pad = pads[i];
  pad.classList.add('lit');
  Sfx.pad(i);
  setTimeout(() => pad.classList.remove('lit'), dur - 60);
}

function playSequence() {
  setStatus('👀 よくみてね...', 'watching');
  accepting = false;
  pads.forEach(p => p.classList.add('disabled'));
  const step = Math.max(280, 520 - stage * 15);
  sequence.forEach((v, i) => {
    setTimeout(() => lightPad(v, step), 450 + i * step);
  });
  setTimeout(() => {
    setStatus('✨ あなたのばん！', 'your-turn');
    pads.forEach(p => p.classList.remove('disabled'));
    accepting = true;
    playerIdx = 0;
  }, 450 + sequence.length * step + 150);
}

function nextRound() {
  stage++;
  stageEl.textContent = stage;
  sequence.push(Math.floor(Math.random() * PADS));
  playSequence();
}

function handlePad(i) {
  if (!accepting) return;
  lightPad(i, 260);
  if (sequence[playerIdx] === i) {
    playerIdx++;
    if (playerIdx === sequence.length) {
      accepting = false;
      pads.forEach(p => p.classList.add('disabled'));
      setStatus('🎉 せいかい！', 'your-turn');
      Sfx.win();
      if (stage > best) {
        best = stage;
        localStorage.setItem('maneko-best', best);
        document.getElementById('best').textContent = best;
      }
      setTimeout(nextRound, 900);
    }
  } else {
    accepting = false;
    pads.forEach(p => p.classList.add('disabled'));
    Sfx.fail();
    setStatus(`😢 ざんねん！ ステージ ${stage} まで！`, 'game-over');
    startBtn.textContent = '▶ もういちど';
    startBtn.disabled = false;
    if (stage >= 5) launchConfetti();
  }
}

pads.forEach(p => {
  p.addEventListener('click', () => {
    const i = +p.dataset.idx;
    if (accepting) { handlePad(i); return; }
    // Free play when game isn't running — lets kids hear the sounds
    if (!startBtn.disabled) lightPad(i, 260);
  });
});

startBtn.addEventListener('click', () => {
  sequence = [];
  stage = 0;
  stageEl.textContent = 0;
  startBtn.disabled = true;
  nextRound();
});

function launchConfetti() {
  const cv = document.getElementById('confetti-layer');
  cv.style.display = 'block';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const ps = Array.from({length: 110}, () => ({
    x: Math.random()*cv.width, y: -20,
    vx: (Math.random()-0.5)*7, vy: 1+Math.random()*5,
    r: 6+Math.random()*10, rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.2,
    color: `hsl(${Math.random()*360},90%,60%)`,
    type: Math.floor(Math.random()*3)
  }));
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    ps.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.rot+=p.vrot;
      if (p.y < cv.height+30) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if (p.type===0) ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.6);
      else if (p.type===1) { ctx.beginPath(); ctx.arc(0,0,p.r/2,0,Math.PI*2); ctx.fill(); }
      else {
        ctx.beginPath();
        for (let j=0;j<5;j++) {
          const a=(j*4*Math.PI/5)-Math.PI/2, b=(j*4*Math.PI/5+2*Math.PI/5)-Math.PI/2;
          j===0 ? ctx.moveTo(Math.cos(a)*p.r,Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
          ctx.lineTo(Math.cos(b)*p.r*0.4,Math.sin(b)*p.r*0.4);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else cv.style.display = 'none';
  }
  draw();
}
</script>
</body>
</html>
