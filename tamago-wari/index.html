<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たまごわり 🥚</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  overflow: hidden;
  background: linear-gradient(-45deg, #fceabb, #f8b500, #fbc2eb, #a6c1ee, #ffdde1, #fceabb);
  background-size: 400% 400%;
  animation: bgAnim 14s ease infinite;
  position: relative;
}
@keyframes bgAnim {
  0%,100% { background-position: 0% 50%; }
  50%      { background-position: 100% 50%; }
}

.floater {
  position: fixed; pointer-events: none;
  opacity: 0.18; font-size: 2rem;
  animation: floatUp linear infinite;
  z-index: 0;
}
@keyframes floatUp {
  from { transform: translateY(110vh) rotate(0); }
  to   { transform: translateY(-20vh) rotate(540deg); }
}

#back-btn {
  position: fixed; top: 0.7rem; left: 0.7rem; z-index: 20;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(10px);
  color: #2a3f5f; border: 1px solid rgba(255,255,255,0.7);
  border-radius: 10px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.88rem; font-weight: 700;
  text-decoration: none; transition: background 0.2s;
}
#back-btn:hover { background: rgba(255,255,255,0.75); }

#title-bar {
  position: fixed; top: 0.7rem; left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: clamp(1.2rem, 4.2vw, 2rem);
  font-weight: 900;
  animation: rainbowText 3s linear infinite;
  text-shadow: 0 0 18px currentColor, 0 3px 6px rgba(0,0,0,0.25);
  pointer-events: none;
  white-space: nowrap;
}
@keyframes rainbowText {
  0%   { color: #ff6b6b; }
  16%  { color: #ffd93d; }
  33%  { color: #6bcb77; }
  50%  { color: #74c0fc; }
  66%  { color: #c77dff; }
  83%  { color: #ff79c6; }
  100% { color: #ff6b6b; }
}

#hud {
  position: fixed; top: 0.7rem; right: 0.7rem; z-index: 15;
}
.pill {
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(10px);
  color: #2a3f5f; border: 1px solid rgba(255,255,255,0.7);
  border-radius: 18px; padding: 0.4rem 0.95rem;
  font-size: 0.95rem; font-weight: 800;
  min-width: 120px; text-align: center;
}
.pill .label {
  display: block; font-size: 0.65rem; opacity: 0.7;
  letter-spacing: 0.05em; font-weight: 700;
}

#play {
  position: fixed; inset: 0;
  z-index: 1;
}

.egg {
  position: absolute;
  width: 110px; height: 130px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  font-size: 6rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 8px 12px rgba(0,0,0,0.28));
  transition: transform 0.1s ease;
}
.egg .emoji {
  position: relative; z-index: 1;
  transition: transform 0.12s ease;
}
.egg.shake .emoji {
  animation: eggShake 0.3s ease;
}
@keyframes eggShake {
  0%,100% { transform: rotate(0) scale(1); }
  20%      { transform: rotate(-10deg) scale(1.05); }
  40%      { transform: rotate(10deg) scale(1.08); }
  60%      { transform: rotate(-6deg) scale(1.06); }
  80%      { transform: rotate(6deg) scale(1.03); }
}
.egg .crack {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 2;
}
.egg .crack svg { width: 100%; height: 100%; }
.egg .crack path { stroke: rgba(40,30,20,0.85); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.egg .crack .c1, .egg .crack .c2 {
  opacity: 0;
  transition: opacity 0.15s ease;
}
.egg.t1 .crack .c1 { opacity: 1; }
.egg.t2 .crack .c1, .egg.t2 .crack .c2 { opacity: 1; }

.egg.hatched {
  animation: hatchPop 0.55s cubic-bezier(0.34,1.8,0.64,1);
}
@keyframes hatchPop {
  0%   { transform: translate(-50%,-50%) scale(0.4) rotate(-20deg); }
  60%  { transform: translate(-50%,-50%) scale(1.3) rotate(10deg); }
  100% { transform: translate(-50%,-50%) scale(1) rotate(0); }
}
.egg.hatched .hatched-animal {
  animation: animalBounce 0.7s ease-in-out infinite alternate;
  display: inline-block;
}
@keyframes animalBounce {
  from { transform: translateY(0) rotate(-4deg); }
  to   { transform: translateY(-12px) rotate(4deg); }
}
.egg.fading {
  animation: fadeOut 0.5s ease forwards;
}
@keyframes fadeOut {
  from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  to   { opacity: 0; transform: translate(-50%, calc(-50% - 40px)) scale(1.1); }
}

.burst {
  position: absolute;
  pointer-events: none;
  font-size: 1.5rem;
  z-index: 5;
  animation: burstOut 0.8s ease-out forwards;
}
@keyframes burstOut {
  0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot)); opacity: 0; }
}

#hint {
  position: fixed; bottom: 1rem; left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: rgba(50,50,70,0.85);
  font-size: 0.95rem; font-weight: 700;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(10px);
  padding: 0.4rem 1.1rem;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.7);
  pointer-events: none;
  white-space: nowrap;
}

@media (max-width: 560px) {
  .egg { width: 90px; height: 108px; font-size: 4.8rem; }
}
</style>
</head>
<body>
<a href="../" id="back-btn">← もどる</a>
<div id="title-bar">🥚 たまごわり</div>
<div id="hud">
  <div class="pill"><span class="label">かえした かず</span><span id="hatched">0</span></div>
</div>
<div id="play"></div>
<div id="hint">たまごを 3かい タップすると なかから どうぶつが でてくるよ！</div>

<script>
// Floating background bubbles
const BG_GLYPHS = ['🌸','🌼','🌺','🌷','✨','⭐','🌟'];
for (let i = 0; i < 16; i++) {
  const f = document.createElement('span');
  f.className = 'floater';
  f.textContent = BG_GLYPHS[i % BG_GLYPHS.length];
  f.style.left = (Math.random() * 100) + 'vw';
  f.style.animationDuration = (18 + Math.random() * 22) + 's';
  f.style.animationDelay = (-Math.random() * 30) + 's';
  f.style.fontSize = (1.2 + Math.random() * 2) + 'rem';
  document.body.appendChild(f);
}

const play = document.getElementById('play');
const hatchedEl = document.getElementById('hatched');

const BABIES = ['🐣','🐥','🦆','🐧','🦉','🦜','🦩','🐢','🦖','🦕','🐍','🦎','🦢','🐤'];
const MAX_EGGS = 4;
const HATCH_STAGE = 3;

let hatched = 0;

// ====== Audio ======
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(_) { audioCtx = null; }
  return audioCtx;
}
function unlockAudio() { const ac = ensureAudio(); if (ac && ac.state === 'suspended') ac.resume(); }
function beep(freq, durMs, vol = 0.2, type = 'sine', glide = 0) {
  const ac = ensureAudio(); if (!ac) return;
  const t = ac.currentTime;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (glide) osc.frequency.exponentialRampToValueAtTime(freq * glide, t + durMs/1000);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + durMs/1000);
  osc.connect(g).connect(ac.destination);
  osc.start(t); osc.stop(t + durMs/1000 + 0.03);
}
function playTap(stage) {
  const base = 350 + stage * 120;
  beep(base, 120, 0.18, 'triangle', 0.6);
}
function playHatch() {
  // Ascending cheerful chime
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((n, i) => setTimeout(() => beep(n, 280, 0.22, 'sine'), i * 60));
}

// ====== Egg placement ======
function randomEggPos() {
  // Leave margins at edges + for HUD
  const margin = 80;
  const topMin = 90;
  const botMax = window.innerHeight - 90;
  for (let tries = 0; tries < 30; tries++) {
    const x = margin + Math.random() * (window.innerWidth - margin * 2);
    const y = topMin + Math.random() * (botMax - topMin);
    let ok = true;
    play.querySelectorAll('.egg').forEach(el => {
      const ex = parseFloat(el.dataset.x);
      const ey = parseFloat(el.dataset.y);
      const dx = ex - x, dy = ey - y;
      if (dx*dx + dy*dy < 150*150) ok = false;
    });
    if (ok) return { x, y };
  }
  return { x: 100 + Math.random()*300, y: 200 + Math.random()*200 };
}

function spawnEgg() {
  if (play.querySelectorAll('.egg:not(.fading)').length >= MAX_EGGS) return;
  const { x, y } = randomEggPos();
  const egg = document.createElement('div');
  egg.className = 'egg';
  egg.dataset.x = x;
  egg.dataset.y = y;
  egg.dataset.stage = '0';
  egg.style.left = x + 'px';
  egg.style.top  = y + 'px';
  egg.innerHTML = `
    <div class="emoji">🥚</div>
    <div class="crack">
      <svg viewBox="0 0 100 120" preserveAspectRatio="none">
        <path class="c1" d="M 30 30 L 45 48 L 35 58 L 55 75 L 45 88" />
        <path class="c2" d="M 60 35 L 50 52 L 68 62 L 55 78 L 70 92" />
      </svg>
    </div>
  `;
  egg.addEventListener('pointerdown', onEggTap);
  play.appendChild(egg);
}

function onEggTap(e) {
  e.preventDefault();
  unlockAudio();
  const egg = e.currentTarget;
  if (egg.classList.contains('hatched') || egg.classList.contains('fading')) return;
  let stage = Number(egg.dataset.stage) + 1;
  egg.dataset.stage = String(stage);

  // shake animation — retrigger
  egg.classList.remove('shake');
  void egg.offsetWidth;
  egg.classList.add('shake');

  egg.classList.toggle('t1', stage === 1);
  egg.classList.toggle('t2', stage >= 2);

  playTap(stage);

  if (stage >= HATCH_STAGE) {
    hatchEgg(egg, e.clientX, e.clientY);
  }
}

function hatchEgg(egg, cx, cy) {
  const baby = BABIES[Math.floor(Math.random() * BABIES.length)];
  egg.innerHTML = `<span class="hatched-animal">${baby}</span>`;
  egg.classList.add('hatched');
  egg.classList.remove('t1', 't2', 'shake');
  playHatch();
  spawnBurst(cx, cy);
  hatched++;
  hatchedEl.textContent = hatched;

  setTimeout(() => {
    egg.classList.add('fading');
    setTimeout(() => {
      egg.remove();
      topUp();
    }, 520);
  }, 1800);
}

function spawnBurst(cx, cy) {
  const glyphs = ['✨','⭐','💫','🌟','🎉','💖'];
  const n = 12;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    el.className = 'burst';
    el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const a = (Math.PI * 2 * i) / n + Math.random() * 0.3;
    const d = 70 + Math.random() * 40;
    el.style.left = cx + 'px';
    el.style.top  = cy + 'px';
    el.style.position = 'fixed';
    el.style.setProperty('--dx', Math.cos(a) * d + 'px');
    el.style.setProperty('--dy', Math.sin(a) * d + 'px');
    el.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 850);
  }
}

function topUp() {
  const alive = play.querySelectorAll('.egg:not(.fading)').length;
  const need = MAX_EGGS - alive;
  for (let i = 0; i < need; i++) {
    setTimeout(spawnEgg, i * 220);
  }
}

window.addEventListener('resize', () => {
  // Keep eggs on screen
  const w = window.innerWidth, h = window.innerHeight;
  play.querySelectorAll('.egg').forEach(el => {
    const x = Math.min(parseFloat(el.dataset.x), w - 40);
    const y = Math.min(parseFloat(el.dataset.y), h - 40);
    el.dataset.x = x; el.dataset.y = y;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
  });
});

topUp();
</script>
</body>
</html>
