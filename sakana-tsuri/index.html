<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さかなつり 🎣</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center;
  color: white;
  background: linear-gradient(180deg, #2980b9 0%, #2c3e92 45%, #0a1a4a 100%);
  position: relative;
}
/* sunrays */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.10) 45%, transparent 50%),
    linear-gradient(75deg, transparent 55%, rgba(255,255,255,0.07) 60%, transparent 65%);
  pointer-events: none; z-index: 0;
}
.bubble {
  position: fixed; bottom: -40px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(255,255,255,0.08));
  border: 1px solid rgba(255,255,255,0.25);
  pointer-events: none; z-index: 0;
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0) translateX(0); opacity: 0; }
  10%  { opacity: 0.6; }
  90%  { opacity: 0.6; }
  100% { transform: translateY(-105vh) translateX(20px); opacity: 0; }
}
/* seabed */
.seabed {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 70px; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, transparent, #06123a);
  text-align: center; font-size: 2.2rem; line-height: 90px;
  letter-spacing: 0.5rem; opacity: 0.85;
}

header {
  position: relative; z-index: 3;
  width: 100%; max-width: 640px;
  padding: 0.9rem 1rem 0.4rem;
  text-align: center;
}
h1 {
  font-size: clamp(1.4rem, 5vw, 2.2rem);
  font-weight: 900;
  text-shadow: 0 0 18px rgba(120,210,255,0.6), 0 3px 6px rgba(0,0,0,0.35);
}
#hud {
  display: flex; gap: 0.5rem; justify-content: center;
  flex-wrap: wrap; margin-top: 0.6rem;
}
.pill {
  background: rgba(255,255,255,0.16);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 30px; padding: 0.35rem 1.1rem;
  font-weight: 900; font-size: 1rem;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  min-width: 96px;
}
.pill.time.low { animation: pulseRed 0.6s ease-in-out infinite; }
@keyframes pulseRed {
  0%,100% { background: rgba(255,80,80,0.35); }
  50%     { background: rgba(255,80,80,0.7); }
}

#pond {
  position: fixed; inset: 0; z-index: 2;
  overflow: hidden;
}
.fish {
  position: absolute;
  font-size: var(--size, 3rem);
  line-height: 1;
  cursor: pointer;
  will-change: transform;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.35));
  transition: transform 0.08s;
}
.fish:active { transform: scale(0.85); }
.fish.flip { transform: scaleX(-1); }
.fish.flip:active { transform: scaleX(-1) scale(0.85); }
.fish.caught {
  pointer-events: none;
  animation: reel 0.5s ease-in forwards;
}
@keyframes reel {
  0%   { opacity: 1; }
  100% { transform: translateY(-60vh) scale(1.4) rotate(25deg); opacity: 0; }
}
.gold { filter: drop-shadow(0 0 12px gold) drop-shadow(0 4px 6px rgba(0,0,0,0.35)); }

.float-pts {
  position: absolute; z-index: 6;
  font-weight: 900; font-size: 1.6rem;
  pointer-events: none;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  animation: floatPts 0.9s ease-out forwards;
}
@keyframes floatPts {
  0%   { transform: translateY(0) scale(0.6); opacity: 0; }
  20%  { opacity: 1; transform: translateY(-10px) scale(1.1); }
  100% { transform: translateY(-60px) scale(1); opacity: 0; }
}

/* overlay (start / result) */
#overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 1.5rem;
  background: rgba(6,18,58,0.55);
  backdrop-filter: blur(6px);
}
#overlay.hidden { display: none; }
.panel {
  background: rgba(255,255,255,0.14);
  border: 2px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(14px);
  border-radius: 28px;
  padding: 2rem 2.2rem;
  max-width: 380px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
.panel h2 {
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  margin-bottom: 0.6rem;
  text-shadow: 0 0 18px rgba(120,210,255,0.6), 0 3px 6px rgba(0,0,0,0.3);
}
.panel p { font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.2rem; opacity: 0.95; }
.panel .big-score { font-size: 3rem; font-weight: 900; margin: 0.2rem 0; }
.panel .best { font-size: 1rem; opacity: 0.9; margin-bottom: 1.2rem; }
.play-btn {
  display: inline-block;
  background: linear-gradient(145deg, #ffd93d, #ff9f1c);
  color: #4a3500; border: none;
  font-size: 1.4rem; font-weight: 900;
  padding: 0.8rem 2.4rem; border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(255,159,28,0.5);
  transition: transform 0.15s;
}
.play-btn:hover { transform: scale(1.06); }
.play-btn:active { transform: scale(0.95); }
.legend {
  display: flex; gap: 0.6rem 1rem; flex-wrap: wrap;
  justify-content: center; font-size: 0.9rem;
  margin-bottom: 1.2rem;
}
.legend span { white-space: nowrap; }

#back-btn, #audio-btn {
  position: fixed; top: 0.8rem; z-index: 30;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(8px);
  color: white; border: 1px solid rgba(255,255,255,0.45);
  border-radius: 10px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.9rem; text-decoration: none;
  font-weight: 700;
}
#back-btn { left: 0.8rem; }
#audio-btn { right: 0.8rem; font-size: 1.1rem; line-height: 1.4; }
#confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 25; display: none; }
</style>
</head>
<body>
<a href="../" id="back-btn">← もどる</a>
<button id="audio-btn" aria-label="おと">🔊</button>

<div class="seabed">🪸 🌿 🐚 🌿 🪨 🌿 🐚</div>

<header>
  <h1>🎣 さかなつり</h1>
  <div id="hud">
    <div class="pill">スコア <span id="score">0</span></div>
    <div class="pill time" id="time-pill">のこり <span id="time">30</span></div>
  </div>
</header>

<div id="pond"></div>

<div id="overlay">
  <div class="panel" id="panel">
    <h2>🎣 さかなつり</h2>
    <p>およいでいる さかなを タップして つりあげよう！<br>30びょうで なんびき つれるかな？</p>
    <div class="legend">
      <span>🐟 1てん</span>
      <span>🐠 2てん</span>
      <span>🦑 3てん</span>
      <span>🐡 はやい！3てん</span>
      <span>🐲 きんのさかな 5てん</span>
    </div>
    <button class="play-btn" id="start-btn">あそぶ！</button>
  </div>
</div>

<canvas id="confetti-layer"></canvas>

<script>
// --- Web Audio SFX ---
const Sfx = (() => {
  let ctx;
  let muted = localStorage.getItem('sfx-muted') === '1';
  const init = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  const play = (freq, dur, type='sine', vol=0.2, delay=0) => {
    if (muted) return;
    init();
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  };
  const seq = (notes, type='triangle', vol=0.22) => {
    let t = 0;
    notes.forEach(([f, d]) => { play(f, d, type, vol, t); t += d * 0.9; });
  };
  return {
    catch:  () => seq([[660,0.07],[990,0.12]], 'triangle', 0.22),
    gold:   () => seq([[784,0.08],[988,0.08],[1319,0.22]], 'triangle', 0.26),
    tick:   () => play(880, 0.05, 'square', 0.12),
    start:  () => seq([[523,0.1],[659,0.1],[784,0.18]], 'triangle', 0.22),
    end:    () => seq([[784,0.14],[587,0.14],[440,0.28]], 'sawtooth', 0.2),
    record: () => seq([[660,0.09],[880,0.09],[1175,0.09],[1568,0.26]], 'triangle', 0.26),
    toggle() { muted = !muted; localStorage.setItem('sfx-muted', muted ? '1' : '0'); return muted; },
    muted: () => muted
  };
})();
(() => {
  const btn = document.getElementById('audio-btn');
  btn.textContent = Sfx.muted() ? '🔇' : '🔊';
  btn.addEventListener('click', () => { btn.textContent = Sfx.toggle() ? '🔇' : '🔊'; });
})();

// --- Background bubbles ---
for (let i = 0; i < 16; i++) {
  const b = document.createElement('span');
  b.className = 'bubble';
  const sz = 6 + Math.random() * 26;
  b.style.width = sz + 'px'; b.style.height = sz + 'px';
  b.style.left = Math.random() * 100 + 'vw';
  b.style.animationDuration = (6 + Math.random() * 8) + 's';
  b.style.animationDelay = -(Math.random() * 10) + 's';
  document.body.appendChild(b);
}

// --- Game ---
const TYPES = [
  { emoji: '🐟', pts: 1, weight: 34, size: 2.8, speed: [60, 95] },
  { emoji: '🐠', pts: 2, weight: 26, size: 3.0, speed: [70, 105] },
  { emoji: '🦑', pts: 3, weight: 14, size: 3.2, speed: [55, 85] },
  { emoji: '🐡', pts: 3, weight: 14, size: 2.6, speed: [150, 200] },
  { emoji: '🐙', pts: 2, weight: 8,  size: 3.2, speed: [50, 75] },
  { emoji: '🐲', pts: 5, weight: 4,  size: 3.4, speed: [120, 170], gold: true },
];
const WEIGHT_TOTAL = TYPES.reduce((s, t) => s + t.weight, 0);
function pickType() {
  let r = Math.random() * WEIGHT_TOTAL;
  for (const t of TYPES) { if ((r -= t.weight) < 0) return t; }
  return TYPES[0];
}

const pond = document.getElementById('pond');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const timePill = document.getElementById('time-pill');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

let score = 0, timeLeft = 30, running = false;
let fishes = [];
let spawnTimer = null, clockTimer = null, lastFrame = 0, rafId = 0;

function bestScore() { return +(localStorage.getItem('sakana-best') || 0); }

function spawnFish() {
  const t = pickType();
  const el = document.createElement('div');
  el.className = 'fish' + (t.gold ? ' gold' : '');
  el.textContent = t.emoji;
  el.style.setProperty('--size', t.size + 'rem');
  const fromLeft = Math.random() < 0.5;
  if (!fromLeft) el.classList.add('flip');
  const topPct = 14 + Math.random() * 64; // keep below header, above seabed
  el.style.top = topPct + 'vh';
  const speed = t.speed[0] + Math.random() * (t.speed[1] - t.speed[0]); // px/s
  const fish = {
    el, t,
    x: fromLeft ? -80 : window.innerWidth + 80,
    dir: fromLeft ? 1 : -1,
    vx: speed,
  };
  el.style.left = fish.x + 'px';
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); catchFish(fish); });
  pond.appendChild(el);
  fishes.push(fish);
}

function catchFish(fish) {
  if (!running || fish.caught) return;
  fish.caught = true;
  fish.el.classList.add('caught');
  score += fish.t.pts;
  scoreEl.textContent = score;
  fish.t.gold ? Sfx.gold() : Sfx.catch();
  showPoints(fish);
  setTimeout(() => removeFish(fish), 500);
}

function showPoints(fish) {
  const p = document.createElement('div');
  p.className = 'float-pts';
  p.textContent = '+' + fish.t.pts;
  p.style.color = fish.t.gold ? 'gold' : '#fff';
  p.style.left = fish.x + 'px';
  p.style.top = fish.el.style.top;
  pond.appendChild(p);
  setTimeout(() => p.remove(), 900);
}

function removeFish(fish) {
  fish.el.remove();
  fishes = fishes.filter(f => f !== fish);
}

function loop(now) {
  if (!running) return;
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  for (const fish of fishes) {
    if (fish.caught) continue;
    fish.x += fish.vx * fish.dir * dt;
    fish.el.style.left = fish.x + 'px';
    if ((fish.dir > 0 && fish.x > window.innerWidth + 90) ||
        (fish.dir < 0 && fish.x < -90)) {
      fish.gone = true;
    }
  }
  fishes.filter(f => f.gone).forEach(removeFish);
  rafId = requestAnimationFrame(loop);
}

function startGame() {
  score = 0; timeLeft = 30; running = true;
  scoreEl.textContent = '0';
  timeEl.textContent = '30';
  timePill.classList.remove('low');
  fishes.forEach(f => f.el.remove());
  fishes = [];
  overlay.classList.add('hidden');
  Sfx.start();

  // initial school
  for (let i = 0; i < 5; i++) setTimeout(spawnFish, i * 250);
  spawnTimer = setInterval(spawnFish, 650);

  clockTimer = setInterval(() => {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 5 && timeLeft > 0) { timePill.classList.add('low'); Sfx.tick(); }
    if (timeLeft <= 0) endGame();
  }, 1000);

  lastFrame = performance.now();
  rafId = requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  clearInterval(spawnTimer); clearInterval(clockTimer);
  cancelAnimationFrame(rafId);
  timePill.classList.remove('low');
  // let remaining fish swim away
  fishes.forEach(f => { f.el.style.pointerEvents = 'none'; });

  const best = bestScore();
  const isRecord = score > best;
  if (isRecord) localStorage.setItem('sakana-best', score);

  let msg;
  if (score === 0) msg = 'またチャレンジしてね！';
  else if (score >= 30) msg = 'さかなつり めいじん！🏆';
  else if (score >= 15) msg = 'おみごと！🎉';
  else msg = 'よくできました！';

  panel.innerHTML = `
    <h2>${isRecord ? '🏆 しんきろく！' : '🎣 おしまい！'}</h2>
    <div class="big-score">${score} てん</div>
    <div class="best">ベスト: ${Math.max(score, best)} てん</div>
    <p>${msg}</p>
    <button class="play-btn" id="again-btn">もういちど！</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('again-btn').addEventListener('click', startGame);

  if (isRecord && score > 0) { Sfx.record(); launchConfetti(); }
  else Sfx.end();
}

document.getElementById('start-btn').addEventListener('click', startGame);

// keep fish above the seabed line on resize is fine (top in vh)

function launchConfetti() {
  const cv = document.getElementById('confetti-layer');
  cv.style.display = 'block';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const ps = Array.from({length: 90}, () => ({
    x: Math.random()*cv.width, y: -20,
    vx: (Math.random()-0.5)*7, vy: 1+Math.random()*5,
    r: 6+Math.random()*10, rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.2,
    color: `hsl(${Math.random()*360},90%,60%)`,
    type: Math.floor(Math.random()*3)
  }));
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    ps.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.rot+=p.vrot;
      if (p.y < cv.height+30) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if (p.type===0) ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.6);
      else if (p.type===1) { ctx.beginPath(); ctx.arc(0,0,p.r/2,0,Math.PI*2); ctx.fill(); }
      else {
        ctx.beginPath();
        for (let j=0;j<5;j++) {
          const a=(j*4*Math.PI/5)-Math.PI/2, b=(j*4*Math.PI/5+2*Math.PI/5)-Math.PI/2;
          j===0 ? ctx.moveTo(Math.cos(a)*p.r,Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
          ctx.lineTo(Math.cos(b)*p.r*0.4,Math.sin(b)*p.r*0.4);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else cv.style.display = 'none';
  }
  draw();
}
</script>
</body>
</html>
