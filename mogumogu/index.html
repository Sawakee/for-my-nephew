<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>もぐもぐごはん 🍙</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
  display: flex; flex-direction: column; align-items: center;
  color: white;
  background: linear-gradient(-45deg, #ffe259, #ffa751, #ff7e5f, #feb47b);
  background-size: 400% 400%;
  animation: bgAnim 14s ease infinite;
  touch-action: none;
}
@keyframes bgAnim {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}
header { text-align: center; padding: 0.8rem 1rem 0.2rem; z-index: 2; }
h1 {
  font-size: clamp(1.4rem, 5vw, 2.1rem); font-weight: 900;
  text-shadow: 0 0 16px rgba(255,255,255,0.5), 0 3px 6px rgba(0,0,0,0.25);
}
#hud { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.5rem; }
.pill {
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.5);
  border-radius: 30px; padding: 0.32rem 1.1rem;
  font-weight: 900; font-size: 1rem; min-width: 96px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.25);
}
.pill.time.low { animation: pulseRed 0.6s ease-in-out infinite; }
@keyframes pulseRed {
  0%,100% { background: rgba(255,80,80,0.4); }
  50%     { background: rgba(255,80,80,0.75); }
}
#stage {
  flex: 1; width: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-evenly;
  z-index: 1;
}
#bubble {
  background: rgba(255,255,255,0.94);
  color: #5c3a00;
  border-radius: 26px;
  padding: 0.7rem 1.6rem;
  font-size: clamp(1.2rem, 5vw, 1.7rem);
  font-weight: 900;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  position: relative;
  animation: bubblePop 0.4s;
}
#bubble::after {
  content: '';
  position: absolute; bottom: -14px; left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top: 10px solid rgba(255,255,255,0.94);
}
@keyframes bubblePop {
  0% { transform: scale(0.4); opacity: 0; }
  70% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
#animal {
  font-size: clamp(6rem, 24vw, 9.5rem);
  line-height: 1.1;
  filter: drop-shadow(0 8px 14px rgba(0,0,0,0.25));
  transition: transform 0.2s;
}
#animal.happy { animation: chomp 0.7s; }
@keyframes chomp {
  0%,100% { transform: scale(1); }
  25% { transform: scale(1.15) rotate(-4deg); }
  50% { transform: scale(1.05) rotate(3deg); }
  75% { transform: scale(1.12) rotate(-2deg); }
}
#animal.no { animation: headShake 0.5s; }
@keyframes headShake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-16px) rotate(-5deg); }
  40%,80% { transform: translateX(16px) rotate(5deg); }
}
#mogu-text {
  min-height: 2.2rem;
  font-size: 1.4rem; font-weight: 900;
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
#tray {
  display: flex; gap: clamp(0.5rem, 3vw, 1.2rem);
  justify-content: center; align-items: center;
  background: rgba(255,255,255,0.25);
  border: 2px solid rgba(255,255,255,0.55);
  border-radius: 26px;
  padding: 0.7rem 1.1rem;
  margin-bottom: 1.4rem;
  backdrop-filter: blur(8px);
}
.food {
  font-size: clamp(2.4rem, 10vw, 3.6rem);
  line-height: 1;
  cursor: grab;
  filter: drop-shadow(0 4px 7px rgba(0,0,0,0.3));
  transition: transform 0.15s;
  touch-action: none;
}
.food.dragging {
  position: fixed; z-index: 50;
  cursor: grabbing;
  transform: scale(1.25);
  transition: none;
  pointer-events: none;
}
#overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 1.5rem;
  background: rgba(120,60,10,0.5);
  backdrop-filter: blur(6px);
}
#overlay.hidden { display: none; }
.panel {
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.5);
  backdrop-filter: blur(14px);
  border-radius: 28px; padding: 2rem 2.2rem;
  max-width: 380px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
.panel h2 { font-size: clamp(1.6rem, 6vw, 2.3rem); margin-bottom: 0.6rem; text-shadow: 0 3px 6px rgba(0,0,0,0.25); }
.panel p { font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.2rem; }
.panel .big-score { font-size: 3rem; font-weight: 900; margin: 0.2rem 0; }
.panel .best { font-size: 1rem; opacity: 0.9; margin-bottom: 1.2rem; }
.play-btn {
  background: linear-gradient(145deg, #ffd93d, #ff9f1c);
  color: #4a3500; border: none;
  font-size: 1.4rem; font-weight: 900;
  padding: 0.8rem 2.4rem; border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(255,159,28,0.5);
  transition: transform 0.15s;
}
.play-btn:hover { transform: scale(1.06); }
.play-btn:active { transform: scale(0.95); }
#back-btn, #audio-btn {
  position: fixed; top: 0.8rem; z-index: 30;
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(8px);
  color: white; border: 1px solid rgba(255,255,255,0.55);
  border-radius: 10px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 700;
}
#back-btn { left: 0.8rem; }
#audio-btn { right: 0.8rem; font-size: 1.1rem; line-height: 1.4; }
#confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 25; display: none; }
</style>
</head>
<body>
<a href="../" id="back-btn">← もどる</a>
<button id="audio-btn" aria-label="おと">🔊</button>

<header>
  <h1>🍙 もぐもぐごはん</h1>
  <div id="hud">
    <div class="pill">たべた <span id="score">0</span></div>
    <div class="pill time" id="time-pill">のこり <span id="time">45</span></div>
  </div>
</header>

<div id="stage">
  <div id="bubble"><span id="want">🍎</span> ちょうだい！</div>
  <div id="animal">🐰</div>
  <div id="mogu-text"></div>
  <div id="tray"></div>
</div>

<div id="overlay">
  <div class="panel" id="panel">
    <h2>🍙 もぐもぐごはん</h2>
    <p>どうぶつさんが ほしがっている<br>たべものを ドラッグして<br>おくちまで はこんであげよう！</p>
    <button class="play-btn" id="start-btn">あそぶ！</button>
  </div>
</div>

<canvas id="confetti-layer"></canvas>

<script>
// --- Web Audio SFX ---
const Sfx = (() => {
  let ctx;
  let muted = localStorage.getItem('sfx-muted') === '1';
  const init = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  const play = (freq, dur, type='sine', vol=0.2, delay=0) => {
    if (muted) return;
    init();
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  };
  const seq = (notes, type='triangle', vol=0.22) => {
    let t = 0;
    notes.forEach(([f, d]) => { play(f, d, type, vol, t); t += d * 0.9; });
  };
  return {
    mogu:  () => seq([[392,0.1],[330,0.1],[392,0.1],[523,0.18]], 'triangle', 0.22),
    no:    () => seq([[220,0.12],[185,0.2]], 'sawtooth', 0.13),
    pick:  () => play(660, 0.05, 'sine', 0.12),
    tick:  () => play(880, 0.05, 'square', 0.12),
    start: () => seq([[523,0.1],[659,0.1],[784,0.18]], 'triangle', 0.22),
    end:   () => seq([[784,0.14],[587,0.14],[440,0.28]], 'sawtooth', 0.2),
    record:() => seq([[660,0.09],[880,0.09],[1175,0.09],[1568,0.26]], 'triangle', 0.26),
    toggle() { muted = !muted; localStorage.setItem('sfx-muted', muted ? '1' : '0'); return muted; },
    muted: () => muted
  };
})();
(() => {
  const btn = document.getElementById('audio-btn');
  btn.textContent = Sfx.muted() ? '🔇' : '🔊';
  btn.addEventListener('click', () => { btn.textContent = Sfx.toggle() ? '🔇' : '🔊'; });
})();

// --- Game ---
const ANIMALS = ['🐰','🐼','🐵','🐶','🐱','🐹','🐻','🦊'];
const FOODS = ['🍎','🍌','🍇','🍓','🍉','🥕','🍙','🍰','🍪','🥦','🍊','🧀'];
const TRAY_SIZE = 5;
const GAME_TIME = 45;

const animalEl = document.getElementById('animal');
const wantEl = document.getElementById('want');
const trayEl = document.getElementById('tray');
const moguEl = document.getElementById('mogu-text');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const timePill = document.getElementById('time-pill');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

let score = 0, timeLeft = GAME_TIME, running = false;
let want = '🍎', clockTimer = null;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newRequest(changeAnimal) {
  if (changeAnimal) animalEl.textContent = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  const foods = shuffle(FOODS.slice()).slice(0, TRAY_SIZE);
  want = foods[Math.floor(Math.random() * foods.length)];
  wantEl.textContent = want;
  const bubble = document.getElementById('bubble');
  bubble.style.animation = 'none';
  void bubble.offsetWidth;
  bubble.style.animation = '';
  moguEl.textContent = '';
  trayEl.innerHTML = '';
  shuffle(foods).forEach(f => {
    const el = document.createElement('span');
    el.className = 'food';
    el.textContent = f;
    enableDrag(el);
    trayEl.appendChild(el);
  });
}

function enableDrag(el) {
  el.addEventListener('pointerdown', (e) => {
    if (!running) return;
    e.preventDefault();
    Sfx.pick();
    const rect = el.getBoundingClientRect();
    const offX = e.clientX - rect.left;
    const offY = e.clientY - rect.top;
    const ghost = document.createElement('span');
    ghost.style.display = 'inline-block';
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    el.parentNode.insertBefore(ghost, el);
    el.classList.add('dragging');
    moveTo(e.clientX, e.clientY);

    function moveTo(x, y) {
      el.style.left = (x - offX) + 'px';
      el.style.top = (y - offY) + 'px';
    }
    function onMove(ev) { moveTo(ev.clientX, ev.clientY); }
    function onUp(ev) {
      removeEventListener('pointermove', onMove);
      removeEventListener('pointerup', onUp);
      removeEventListener('pointercancel', onUp);
      const fed = tryFeed(el, ev.clientX, ev.clientY);
      el.classList.remove('dragging');
      el.style.left = el.style.top = '';
      if (fed) { ghost.remove(); el.remove(); }
      else ghost.replaceWith(el);
    }
    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);
  });
}

function tryFeed(el, x, y) {
  const r = animalEl.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if (Math.hypot(x - cx, y - cy) > Math.max(r.width, 120) * 0.75) return false;
  if (el.textContent === want) {
    score++;
    scoreEl.textContent = score;
    moguEl.textContent = 'もぐもぐ… おいしい！😋';
    animalEl.classList.add('happy');
    Sfx.mogu();
    setTimeout(() => {
      animalEl.classList.remove('happy');
      if (running) newRequest(score % 3 === 0);
    }, 750);
    return true;
  }
  moguEl.textContent = 'それじゃないよ〜 🙅';
  animalEl.classList.add('no');
  Sfx.no();
  setTimeout(() => animalEl.classList.remove('no'), 550);
  return false;
}

function startGame() {
  score = 0; timeLeft = GAME_TIME; running = true;
  scoreEl.textContent = '0';
  timeEl.textContent = GAME_TIME;
  timePill.classList.remove('low');
  overlay.classList.add('hidden');
  Sfx.start();
  newRequest(true);
  clockTimer = setInterval(() => {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 5 && timeLeft > 0) { timePill.classList.add('low'); Sfx.tick(); }
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  running = false;
  clearInterval(clockTimer);
  timePill.classList.remove('low');
  const best = +(localStorage.getItem('mogumogu-best') || 0);
  const isRecord = score > best;
  if (isRecord) localStorage.setItem('mogumogu-best', score);

  let msg;
  if (score === 0) msg = 'またチャレンジしてね！';
  else if (score >= 15) msg = 'ごはんやさん めいじん！🏆';
  else if (score >= 8) msg = 'どうぶつたちも おなかいっぱい！🎉';
  else msg = 'よくできました！';

  panel.innerHTML = `
    <h2>${isRecord && score > 0 ? '🏆 しんきろく！' : '🍙 おしまい！'}</h2>
    <div class="big-score">${score} こ</div>
    <div class="best">ベスト: ${Math.max(score, best)} こ</div>
    <p>${msg}</p>
    <button class="play-btn" id="again-btn">もういちど！</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('again-btn').addEventListener('click', startGame);

  if (isRecord && score > 0) { Sfx.record(); launchConfetti(); }
  else Sfx.end();
}

document.getElementById('start-btn').addEventListener('click', startGame);

function launchConfetti() {
  const cv = document.getElementById('confetti-layer');
  cv.style.display = 'block';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const ps = Array.from({length: 90}, () => ({
    x: Math.random()*cv.width, y: -20,
    vx: (Math.random()-0.5)*7, vy: 1+Math.random()*5,
    r: 6+Math.random()*10, rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.2,
    color: `hsl(${Math.random()*360},90%,60%)`,
    type: Math.floor(Math.random()*3)
  }));
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    ps.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.rot+=p.vrot;
      if (p.y < cv.height+30) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if (p.type===0) ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.6);
      else if (p.type===1) { ctx.beginPath(); ctx.arc(0,0,p.r/2,0,Math.PI*2); ctx.fill(); }
      else {
        ctx.beginPath();
        for (let j=0;j<5;j++) {
          const a=(j*4*Math.PI/5)-Math.PI/2, b=(j*4*Math.PI/5+2*Math.PI/5)-Math.PI/2;
          j===0 ? ctx.moveTo(Math.cos(a)*p.r,Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
          ctx.lineTo(Math.cos(b)*p.r*0.4,Math.sin(b)*p.r*0.4);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else cv.style.display = 'none';
  }
  draw();
}
</script>
</body>
</html>
