<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>めいろ 🐭</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  user-select: none; padding: 1rem;
  background: linear-gradient(-45deg, #134e5e, #71b280, #2e8b57, #134e5e);
  background-size: 400% 400%;
  animation: bgAnim 12s ease infinite;
  position: relative; overflow: hidden;
  touch-action: none;
}
@keyframes bgAnim {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}
.bg-leaf {
  position: fixed; pointer-events: none;
  font-size: 1.5rem; opacity: 0.15;
  animation: leafFall linear infinite;
}
@keyframes leafFall {
  0%   { transform: translateY(-10vh) rotate(0) translateX(0); }
  100% { transform: translateY(110vh) rotate(720deg) translateX(60px); }
}
h1 {
  position: relative; z-index: 1;
  font-size: clamp(1.7rem, 5.5vw, 2.8rem);
  font-weight: 900; margin-bottom: 0.4rem;
  color: white;
  text-shadow: 0 0 20px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.35);
}
#stats {
  position: relative; z-index: 1;
  display: flex; gap: 0.6rem; margin-bottom: 0.7rem;
  flex-wrap: wrap; justify-content: center;
}
.stat-pill {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.35);
  border-radius: 30px; padding: 0.35rem 1rem;
  color: white; font-size: 0.95rem; font-weight: 700;
  text-shadow: 0 2px 4px rgba(0,0,0,0.25);
}
#diff-selector {
  position: relative; z-index: 1;
  display: flex; gap: 0.45rem; margin-bottom: 1rem; flex-wrap: wrap; justify-content: center;
}
.diff-btn {
  padding: 0.35rem 1rem; border: 2px solid rgba(255,255,255,0.3);
  border-radius: 25px; background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.75); font-weight: 700; font-size: 0.88rem;
  cursor: pointer; transition: all 0.2s;
}
.diff-btn:hover { background: rgba(255,255,255,0.18); color: white; }
.diff-btn.active {
  background: linear-gradient(135deg, #feca57, #ff9f43);
  color: white; border-color: rgba(255,255,255,0.6);
  box-shadow: 0 4px 12px rgba(254,159,67,0.4);
}
#maze {
  position: relative; z-index: 1;
  display: grid;
  background: rgba(0,0,0,0.35);
  border-radius: 16px; padding: 6px;
  border: 3px solid rgba(255,255,255,0.3);
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  max-width: min(90vw, 560px);
}
.cell {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
  font-size: clamp(0.5rem, 2.5vw, 1.3rem);
  border-radius: 3px;
}
.cell.wall { background: linear-gradient(145deg, #5d4037, #3e2723); box-shadow: inset 0 1px 2px rgba(255,255,255,0.1); }
.cell.path { background: linear-gradient(145deg, #c8e6c9, #a5d6a7); }
.cell.start { background: linear-gradient(145deg, #fff59d, #fdd835); }
.cell.goal {
  background: linear-gradient(145deg, #ffccbc, #ff8a65);
  animation: goalPulse 1.2s ease-in-out infinite;
}
@keyframes goalPulse {
  0%,100% { box-shadow: 0 0 8px rgba(255,138,101,0.7); }
  50%     { box-shadow: 0 0 18px rgba(255,138,101,1); }
}
.cell.player {
  background: linear-gradient(145deg, #81d4fa, #29b6f6);
  animation: playerBounce 0.5s ease;
  z-index: 1;
}
@keyframes playerBounce {
  0%   { transform: scale(0.7); }
  60%  { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.cell.trail { background: linear-gradient(145deg, #e1f5fe, #b3e5fc); opacity: 0.85; }
#message {
  position: relative; z-index: 1;
  color: white; font-size: clamp(1.1rem, 4vw, 1.6rem);
  font-weight: 900; min-height: 2em; text-align: center;
  margin-top: 1rem;
  text-shadow: 0 0 18px rgba(255,255,255,0.6), 0 3px 6px rgba(0,0,0,0.3);
}
#restart-btn {
  position: relative; z-index: 1;
  margin-top: 0.7rem; padding: 0.7rem 2rem;
  font-size: 1.05rem; border: none; border-radius: 30px;
  background: linear-gradient(135deg, #ffd93d, #ff6b6b);
  color: white; font-weight: 900; cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,107,107,0.45);
  display: none; transition: transform 0.2s;
  text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}
#restart-btn:hover { transform: scale(1.07); }
#controls {
  position: relative; z-index: 1;
  color: rgba(255,255,255,0.7); font-size: 0.85rem;
  text-align: center; line-height: 1.8; margin-top: 0.7rem;
}
.keyboard-hint { display: inline; }
.touch-hint    { display: none; }
@media (pointer: coarse) {
  .keyboard-hint { display: none; }
  .touch-hint    { display: inline; }
}
#back-btn, #audio-btn {
  position: fixed; top: 1rem; z-index: 10;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  color: white; border: 1px solid rgba(255,255,255,0.35);
  border-radius: 10px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.9rem; text-decoration: none;
  transition: background 0.2s;
}
#back-btn { left: 1rem; }
#audio-btn { right: 1rem; font-size: 1.1rem; line-height: 1; }
#back-btn:hover, #audio-btn:hover { background: rgba(255,255,255,0.3); }
#confetti-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 100; display: none;
}
</style>
</head>
<body>
<a href="../" id="back-btn">← もどる</a>
<button id="audio-btn" aria-label="おと">🔊</button>

<h1>🐭 めいろ</h1>
<div id="stats">
  <div class="stat-pill">てすう: <span id="moves">0</span></div>
  <div class="stat-pill">じかん: <span id="timer">0</span>びょう</div>
</div>
<div id="diff-selector">
  <button class="diff-btn active" data-size="5">かんたん</button>
  <button class="diff-btn" data-size="7">ふつう</button>
  <button class="diff-btn" data-size="10">むずかしい</button>
</div>
<div id="maze"></div>
<div id="message"></div>
<button id="restart-btn">あたらしい めいろ 🔄</button>
<div id="controls">
  <span class="keyboard-hint">← → ↑ ↓ キーで 🐭 をうごかそう</span>
  <span class="touch-hint">スワイプで 🐭 をうごかそう！</span>
</div>
<canvas id="confetti-layer"></canvas>

<script>
// --- Web Audio SFX ---
const Sfx = (() => {
  let ctx;
  let muted = localStorage.getItem('sfx-muted') === '1';
  const init = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  const play = (freq, dur, type='sine', vol=0.2, delay=0) => {
    if (muted) return;
    init();
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  };
  const seq = (notes, type='triangle', vol=0.22) => {
    let t = 0;
    notes.forEach(([f, d]) => { play(f, d, type, vol, t); t += d * 0.9; });
  };
  return {
    step: () => play(200 + Math.random()*80, 0.04, 'square', 0.08),
    bump: () => play(110, 0.1, 'sawtooth', 0.15),
    clear: () => seq([[523,0.14],[659,0.14],[784,0.14],[1047,0.18],[1319,0.3]], 'triangle', 0.28),
    toggle() { muted = !muted; localStorage.setItem('sfx-muted', muted ? '1' : '0'); return muted; },
    muted: () => muted
  };
})();
(() => {
  const btn = document.getElementById('audio-btn');
  btn.textContent = Sfx.muted() ? '🔇' : '🔊';
  btn.addEventListener('click', () => {
    const m = Sfx.toggle();
    btn.textContent = m ? '🔇' : '🔊';
  });
})();

// Background leaves
const LEAVES = ['🍃','🌿','🍂'];
for (let i = 0; i < 12; i++) {
  const el = document.createElement('span');
  el.className = 'bg-leaf';
  el.textContent = LEAVES[Math.floor(Math.random()*LEAVES.length)];
  el.style.left = Math.random()*100 + 'vw';
  el.style.animationDuration = (9 + Math.random()*8) + 's';
  el.style.animationDelay = (Math.random()*10) + 's';
  document.body.appendChild(el);
}

// --- Maze generation (recursive backtracking on cells, rendered as (2N+1)² grid) ---
let cellSize = 5; // N cells per side; display grid is (2N+1)²
let grid;         // display grid of 0 (path) / 1 (wall)
let W, H;         // display dimensions
let px, py;       // player position (display coords)
let gx, gy;       // goal position
let moves = 0;
let solved = false;
let trail;        // Set of "x,y" visited path cells for fading trail
let startTime = 0;
let timerInterval = null;

const mazeEl  = document.getElementById('maze');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const msgEl   = document.getElementById('message');
const restartBtn = document.getElementById('restart-btn');

function generateMaze(N) {
  W = H = 2 * N + 1;
  grid = Array.from({length: H}, () => Array(W).fill(1)); // all walls
  const visited = Array.from({length: N}, () => Array(N).fill(false));
  const stack = [[0, 0]];
  visited[0][0] = true;
  grid[1][1] = 0;
  while (stack.length) {
    const [cx, cy] = stack[stack.length - 1];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].sort(() => Math.random() - 0.5);
    let carved = false;
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= N || ny < 0 || ny >= N) continue;
      if (visited[ny][nx]) continue;
      visited[ny][nx] = true;
      // Cell display coords: (2*cx+1, 2*cy+1); carve wall between cur and next
      grid[2*cy + 1 + dy][2*cx + 1 + dx] = 0;
      grid[2*ny + 1][2*nx + 1] = 0;
      stack.push([nx, ny]);
      carved = true;
      break;
    }
    if (!carved) stack.pop();
  }
  px = 1; py = 1;
  gx = W - 2; gy = H - 2;
}

function render() {
  mazeEl.style.gridTemplateColumns = `repeat(${W}, 1fr)`;
  mazeEl.innerHTML = '';
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = document.createElement('div');
      c.className = 'cell';
      if (grid[y][x] === 1) c.classList.add('wall');
      else if (x === px && y === py) { c.classList.add('player'); c.textContent = '🐭'; }
      else if (x === gx && y === gy) { c.classList.add('goal'); c.textContent = '🧀'; }
      else if (trail.has(`${x},${y}`)) c.classList.add('trail');
      else if (x === 1 && y === 1) c.classList.add('start');
      else c.classList.add('path');
      mazeEl.appendChild(c);
    }
  }
}

function tryMove(dx, dy) {
  if (solved) return;
  const nx = px + dx, ny = py + dy;
  if (nx < 0 || nx >= W || ny < 0 || ny >= H || grid[ny][nx] === 1) {
    Sfx.bump();
    return;
  }
  trail.add(`${px},${py}`);
  px = nx; py = ny;
  moves++;
  movesEl.textContent = moves;
  Sfx.step();
  render();
  if (px === gx && py === gy) {
    solved = true;
    stopTimer();
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    msgEl.textContent = `🎉 ゴール！ ${moves}て / ${elapsed}びょう 🎉`;
    restartBtn.style.display = 'inline-block';
    setTimeout(() => Sfx.clear(), 150);
    launchConfetti();
  }
}

document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key)) return;
  e.preventDefault();
  if (key === 'ArrowLeft')  tryMove(-1, 0);
  if (key === 'ArrowRight') tryMove( 1, 0);
  if (key === 'ArrowUp')    tryMove( 0,-1);
  if (key === 'ArrowDown')  tryMove( 0, 1);
});

// Swipe handling on the maze
let touchStart = null;
mazeEl.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
mazeEl.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 20) { touchStart = null; return; }
  if (ax > ay) tryMove(dx > 0 ? 1 : -1, 0);
  else         tryMove(0, dy > 0 ? 1 : -1);
  touchStart = null;
}, { passive: true });

function startTimer() {
  startTime = Date.now();
  timerEl.textContent = '0';
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerEl.textContent = Math.floor((Date.now() - startTime) / 1000);
  }, 500);
}
function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

function newGame() {
  generateMaze(cellSize);
  moves = 0; solved = false; trail = new Set();
  movesEl.textContent = '0';
  msgEl.textContent = '';
  restartBtn.style.display = 'none';
  startTimer();
  render();
}

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const s = +btn.dataset.size;
    if (s === cellSize) return;
    cellSize = s;
    document.querySelectorAll('.diff-btn').forEach(b =>
      b.classList.toggle('active', +b.dataset.size === s));
    newGame();
  });
});
restartBtn.addEventListener('click', newGame);

function launchConfetti() {
  const cv = document.getElementById('confetti-layer');
  cv.style.display = 'block';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const ps = Array.from({length: 110}, () => ({
    x: Math.random()*cv.width, y: -20,
    vx: (Math.random()-0.5)*7, vy: 1+Math.random()*5,
    r: 6+Math.random()*10, rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.2,
    color: `hsl(${Math.random()*360},90%,60%)`,
    type: Math.floor(Math.random()*3)
  }));
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    ps.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.rot+=p.vrot;
      if (p.y < cv.height+30) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if (p.type===0) ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.6);
      else if (p.type===1) { ctx.beginPath(); ctx.arc(0,0,p.r/2,0,Math.PI*2); ctx.fill(); }
      else {
        ctx.beginPath();
        for (let j=0;j<5;j++) {
          const a=(j*4*Math.PI/5)-Math.PI/2, b=(j*4*Math.PI/5+2*Math.PI/5)-Math.PI/2;
          j===0 ? ctx.moveTo(Math.cos(a)*p.r,Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
          ctx.lineTo(Math.cos(b)*p.r*0.4,Math.sin(b)*p.r*0.4);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else cv.style.display = 'none';
  }
  draw();
}

newGame();
</script>
</body>
</html>
