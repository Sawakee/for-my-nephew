<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがなタッチ 🔤</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
  display: flex; flex-direction: column; align-items: center;
  color: white;
  background: linear-gradient(-45deg, #43cea2, #185a9d, #6a82fb, #45b7d1);
  background-size: 400% 400%;
  animation: bgAnim 14s ease infinite;
}
@keyframes bgAnim {
  0%,100% { background-position: 0% 50%; }
  50%     { background-position: 100% 50%; }
}
header { text-align: center; padding: 0.8rem 1rem 0.2rem; z-index: 2; }
h1 {
  font-size: clamp(1.3rem, 4.5vw, 2rem); font-weight: 900;
  text-shadow: 0 0 16px rgba(120,255,220,0.5), 0 3px 6px rgba(0,0,0,0.3);
}
#hud { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.5rem; }
.pill {
  background: rgba(255,255,255,0.16);
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 30px; padding: 0.32rem 1.1rem;
  font-weight: 900; font-size: 1rem;
  min-width: 96px;
}
.pill.time.low { animation: pulseRed 0.6s ease-in-out infinite; }
@keyframes pulseRed {
  0%,100% { background: rgba(255,80,80,0.35); }
  50%     { background: rgba(255,80,80,0.7); }
}
#target-box {
  margin-top: 0.5rem;
  font-size: 1.15rem; font-weight: 900;
  text-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
#target {
  display: inline-block;
  font-size: 2.4rem;
  background: rgba(255,255,255,0.92);
  color: #1d3557;
  border-radius: 16px;
  padding: 0.1rem 1rem;
  margin: 0 0.4rem;
  box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  animation: targetPop 0.4s;
}
@keyframes targetPop {
  0% { transform: scale(0.4) rotate(-8deg); }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
#grid {
  flex: 1; width: min(94vw, 520px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(0.5rem, 2vw, 0.9rem);
  align-content: center;
  padding: 0.8rem 0 1.4rem;
}
.kana {
  aspect-ratio: 1;
  display: grid; place-items: center;
  font-size: clamp(1.8rem, 8vw, 3rem);
  font-weight: 900;
  color: #1d3557;
  background: rgba(255,255,255,0.92);
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 5px 14px rgba(0,0,0,0.25);
  transition: transform 0.12s;
}
.kana:active { transform: scale(0.9); }
.kana.good { animation: goodFlash 0.45s; }
@keyframes goodFlash {
  0% { background: #69db7c; transform: scale(1.15); }
  100% { background: rgba(255,255,255,0.92); transform: scale(1); }
}
.kana.bad { animation: badShake 0.35s; }
@keyframes badShake {
  0%,100% { transform: translateX(0); background: rgba(255,255,255,0.92); }
  25% { transform: translateX(-8px); background: #ffa8a8; }
  75% { transform: translateX(8px); background: #ffa8a8; }
}
#overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 1.5rem;
  background: rgba(10,40,60,0.55);
  backdrop-filter: blur(6px);
}
#overlay.hidden { display: none; }
.panel {
  background: rgba(255,255,255,0.14);
  border: 2px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(14px);
  border-radius: 28px; padding: 2rem 2.2rem;
  max-width: 380px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
.panel h2 { font-size: clamp(1.6rem, 6vw, 2.3rem); margin-bottom: 0.6rem; }
.panel p { font-size: 1.05rem; line-height: 1.7; margin-bottom: 1.2rem; }
.panel .big-score { font-size: 3rem; font-weight: 900; margin: 0.2rem 0; }
.panel .best { font-size: 1rem; opacity: 0.9; margin-bottom: 1.2rem; }
.play-btn {
  background: linear-gradient(145deg, #ffd93d, #ff9f1c);
  color: #4a3500; border: none;
  font-size: 1.4rem; font-weight: 900;
  padding: 0.8rem 2.4rem; border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(255,159,28,0.5);
  transition: transform 0.15s;
}
.play-btn:hover { transform: scale(1.06); }
.play-btn:active { transform: scale(0.95); }
#back-btn, #audio-btn {
  position: fixed; top: 0.8rem; z-index: 30;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(8px);
  color: white; border: 1px solid rgba(255,255,255,0.45);
  border-radius: 10px; padding: 0.4rem 0.9rem;
  cursor: pointer; font-size: 0.9rem; text-decoration: none; font-weight: 700;
}
#back-btn { left: 0.8rem; }
#audio-btn { right: 0.8rem; font-size: 1.1rem; line-height: 1.4; }
#confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 25; display: none; }
</style>
</head>
<body>
<a href="../" id="back-btn">← もどる</a>
<button id="audio-btn" aria-label="おと">🔊</button>

<header>
  <h1>🔤 ひらがなタッチ</h1>
  <div id="hud">
    <div class="pill">スコア <span id="score">0</span></div>
    <div class="pill time" id="time-pill">のこり <span id="time">30</span></div>
  </div>
  <div id="target-box"><span id="target">あ</span>は どれかな？</div>
</header>

<div id="grid"></div>

<div id="overlay">
  <div class="panel" id="panel">
    <h2>🔤 ひらがなタッチ</h2>
    <p>うえに でた ひらがなを<br>カードの なかから さがして タップ！<br>30びょうで なんもん できるかな？</p>
    <button class="play-btn" id="start-btn">あそぶ！</button>
  </div>
</div>

<canvas id="confetti-layer"></canvas>

<script>
// --- Web Audio SFX ---
const Sfx = (() => {
  let ctx;
  let muted = localStorage.getItem('sfx-muted') === '1';
  const init = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  const play = (freq, dur, type='sine', vol=0.2, delay=0) => {
    if (muted) return;
    init();
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
  };
  const seq = (notes, type='triangle', vol=0.22) => {
    let t = 0;
    notes.forEach(([f, d]) => { play(f, d, type, vol, t); t += d * 0.9; });
  };
  return {
    good:  () => seq([[784,0.08],[1175,0.14]], 'triangle', 0.22),
    bad:   () => play(170, 0.2, 'sawtooth', 0.14),
    tick:  () => play(880, 0.05, 'square', 0.12),
    start: () => seq([[523,0.1],[659,0.1],[784,0.18]], 'triangle', 0.22),
    end:   () => seq([[784,0.14],[587,0.14],[440,0.28]], 'sawtooth', 0.2),
    record:() => seq([[660,0.09],[880,0.09],[1175,0.09],[1568,0.26]], 'triangle', 0.26),
    toggle() { muted = !muted; localStorage.setItem('sfx-muted', muted ? '1' : '0'); return muted; },
    muted: () => muted
  };
})();
(() => {
  const btn = document.getElementById('audio-btn');
  btn.textContent = Sfx.muted() ? '🔇' : '🔊';
  btn.addEventListener('click', () => { btn.textContent = Sfx.toggle() ? '🔇' : '🔊'; });
})();

// 読み上げ（つかえるブラウザだけ）
function speak(text) {
  if (!('speechSynthesis' in window) || Sfx.muted()) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 0.85; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch (e) { /* なくてもあそべる */ }
}

// --- Game ---
const KANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split('');
const CARDS = 12;

const grid = document.getElementById('grid');
const targetEl = document.getElementById('target');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const timePill = document.getElementById('time-pill');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

let score = 0, timeLeft = 30, running = false, locked = false;
let target = 'あ', clockTimer = null;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newRound() {
  locked = false;
  const chars = shuffle(KANA.slice()).slice(0, CARDS);
  target = chars[Math.floor(Math.random() * chars.length)];
  targetEl.textContent = target;
  targetEl.style.animation = 'none';
  void targetEl.offsetWidth;
  targetEl.style.animation = '';
  grid.innerHTML = '';
  shuffle(chars).forEach(ch => {
    const c = document.createElement('div');
    c.className = 'kana';
    c.textContent = ch;
    c.addEventListener('pointerdown', () => tapCard(c, ch));
    grid.appendChild(c);
  });
  speak(target);
}

function tapCard(el, ch) {
  if (!running || locked) return;
  if (ch === target) {
    locked = true;
    score++;
    scoreEl.textContent = score;
    el.classList.add('good');
    Sfx.good();
    setTimeout(newRound, 420);
  } else {
    el.classList.add('bad');
    Sfx.bad();
    setTimeout(() => el.classList.remove('bad'), 380);
  }
}

targetEl.addEventListener('pointerdown', () => speak(target));

function startGame() {
  score = 0; timeLeft = 30; running = true;
  scoreEl.textContent = '0';
  timeEl.textContent = '30';
  timePill.classList.remove('low');
  overlay.classList.add('hidden');
  Sfx.start();
  newRound();
  clockTimer = setInterval(() => {
    timeLeft--;
    timeEl.textContent = timeLeft;
    if (timeLeft <= 5 && timeLeft > 0) { timePill.classList.add('low'); Sfx.tick(); }
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  running = false;
  clearInterval(clockTimer);
  timePill.classList.remove('low');
  const best = +(localStorage.getItem('hiragana-touch-best') || 0);
  const isRecord = score > best;
  if (isRecord) localStorage.setItem('hiragana-touch-best', score);

  let msg;
  if (score === 0) msg = 'またチャレンジしてね！';
  else if (score >= 15) msg = 'ひらがな はかせ！🏆';
  else if (score >= 8) msg = 'すごい！🎉';
  else msg = 'よくできました！';

  panel.innerHTML = `
    <h2>${isRecord ? '🏆 しんきろく！' : '🔤 おしまい！'}</h2>
    <div class="big-score">${score} もん</div>
    <div class="best">ベスト: ${Math.max(score, best)} もん</div>
    <p>${msg}</p>
    <button class="play-btn" id="again-btn">もういちど！</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('again-btn').addEventListener('click', startGame);

  if (isRecord && score > 0) { Sfx.record(); launchConfetti(); }
  else Sfx.end();
}

document.getElementById('start-btn').addEventListener('click', startGame);

function launchConfetti() {
  const cv = document.getElementById('confetti-layer');
  cv.style.display = 'block';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const ctx = cv.getContext('2d');
  const ps = Array.from({length: 90}, () => ({
    x: Math.random()*cv.width, y: -20,
    vx: (Math.random()-0.5)*7, vy: 1+Math.random()*5,
    r: 6+Math.random()*10, rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.2,
    color: `hsl(${Math.random()*360},90%,60%)`,
    type: Math.floor(Math.random()*3)
  }));
  function draw() {
    ctx.clearRect(0,0,cv.width,cv.height);
    let alive = false;
    ps.forEach(p => {
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.07; p.rot+=p.vrot;
      if (p.y < cv.height+30) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color;
      if (p.type===0) ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*0.6);
      else if (p.type===1) { ctx.beginPath(); ctx.arc(0,0,p.r/2,0,Math.PI*2); ctx.fill(); }
      else {
        ctx.beginPath();
        for (let j=0;j<5;j++) {
          const a=(j*4*Math.PI/5)-Math.PI/2, b=(j*4*Math.PI/5+2*Math.PI/5)-Math.PI/2;
          j===0 ? ctx.moveTo(Math.cos(a)*p.r,Math.sin(a)*p.r) : ctx.lineTo(Math.cos(a)*p.r,Math.sin(a)*p.r);
          ctx.lineTo(Math.cos(b)*p.r*0.4,Math.sin(b)*p.r*0.4);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    });
    if (alive) requestAnimationFrame(draw);
    else cv.style.display = 'none';
  }
  draw();
}
</script>
</body>
</html>
